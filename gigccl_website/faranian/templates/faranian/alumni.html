{% extends 'base.html' %}
{% load static %}
{% block content %}

<style>
    .hero-section img {
        height: 500px;
        width: 100%;
    }

    .card {
        height: 100%;
        display: flex;
        flex-direction: column;
    }
    
    .card-img-top {
        height: 300px;
        object-fit: conatin;
        width: 100%;
    }
    
    .card-body {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    
    h2 {
        color: #964734 !important;
    }
    .custom-shadow {
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3); /* Darker shadow */
    }
    
</style>

<!-- Hero Section -->
<section class="hero-section">
    <img src="{% static 'images/alumni_banner.jpg' %}" class="img-fluid w-100" alt="Alumni">
</section>

<!-- Alumni Section -->
<section class="alumni py-5">
    <div class="container">
        <div class="d-flex justify-content-center" data-aos="zoom-in" data-aos-duration="500">
            <h2 class="text-center px-4 py-2 bg-light rounded custom-shadow fw-bold text-uppercase">Faranian Alumni Fraternity</h2>
        </div>        
        <div class="row mt-4">
            {% for alumni in alumni_list %}
            <div class="col-lg-4 col-md-6 col-sm-12 mb-4 d-flex align-items-stretch">
                <div class="card p-1 custom-shadow w-100" data-aos="zoom-in" data-aos-duration="500">
                    <img src="{{ alumni.image.url }}" class="card-img-top img-fluid" alt="Alumni">
                    <div class="card-body text-center d-flex flex-column justify-content-center">
                        <h5 class="card-title">{{ alumni.name }}</h5>
                    </div>
                </div>
            </div>
            {% empty %}
                <div class="d-flex justify-content-center mb-4">
                    <div class="card border-0 shadow-sm px-4 py-2" style="background-color: #f8f9fa; width: fit-content;">
                        <h2 class="mb-0 text-center" style="color: #964734;">No Alumni Available</h2>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</section>

{% endblock %}
